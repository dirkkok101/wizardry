@if (visible()) {
  <div class="dialog-overlay" (click)="onBackdropClick($event)">
    <div class="dialog-panel" (click)="$event.stopPropagation()">

      <!-- Header -->
      <header class="panel-header">
        <h2 class="panel-title">{{ prompt() }}</h2>
      </header>

      <!-- Character Grid using CharacterPanel -->
      <div class="character-grid">
        @if (characters().length > 0) {
          <app-character-panel
            [characters]="characters()"
            [actions]="getActionsForCharacter"
            [visibleActionTypes]="visibleActionTypes"
            [showSprites]="true"
            [layoutMode]="'grid'"
            (actionClick)="handleActionClick($event)"
          />
        } @else {
          <div class="no-characters">No characters in roster</div>
        }
      </div>

      <!-- Footer -->
      <footer class="panel-footer">
        <span class="instruction">ESC to close</span>
      </footer>
    </div>
  </div>
}
