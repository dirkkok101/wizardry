<!-- Floating Damage Numbers Layer -->
<div class="floating-damage-container">
  @for (entry of entries(); track trackById($index, entry)) {
    <div
      class="floating-damage"
      [class]="getTypeClass(entry.type)"
      [style.left]="entry.x + '%'"
      [style.top]="entry.y + '%'"
      (animationend)="onAnimationEnd(entry.id)"
    >
      {{ entry.text }}
    </div>
  }
</div>
