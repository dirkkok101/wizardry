<div class="character-card"
     [ngClass]="{
       'default': variant === 'default',
       'compact': variant === 'compact',
       'highlighted': highlighted,
       'dead': isDead
     }">
  <!-- Active Indicator (pulsing arrow) -->
  <span class="active-indicator" *ngIf="highlighted && !isDead">&#9654;</span>

  <!-- Header: Name + Status -->
  <div class="card-header">
    <!-- Optional sprite thumbnail -->
    <div class="sprite-thumbnail" *ngIf="showSprite" [class.small]="spriteSize === 'small'">
      <img [src]="spriteUrl" [alt]="character.name" />
    </div>
    <div class="character-name">{{ character.name }}</div>
    <app-status-badge [status]="character.status" variant="badge"></app-status-badge>
  </div>

  <div class="card-divider"></div>

  <!-- Stats Section -->
  <div class="card-stats" *ngIf="hasStats">
    <app-character-stats
      [character]="character"
      [fields]="displayFields"
      [layout]="variant === 'compact' ? 'horizontal' : 'vertical'">
    </app-character-stats>
  </div>

  <!-- HP Bar (optional) -->
  <div class="hp-bar-container" *ngIf="showHpBar && !isDead">
    <div class="hp-bar">
      <div class="hp-fill"
           [style.width.%]="hpPercent"
           [class.critical]="hpPercent <= 25"
           [class.low]="hpPercent > 25 && hpPercent <= 50"
           [class.healthy]="hpPercent > 50">
      </div>
    </div>
    <div class="hp-context" *ngIf="showHpContext && hpNeeded > 0">{{ hpNeeded }} HP to heal</div>
  </div>

  <!-- Dead Badge -->
  <div class="dead-badge" *ngIf="isDead && showHpBar">DEAD</div>

  <!-- Status Text (e.g., selected action in combat) -->
  <div class="status-text" *ngIf="statusText">{{ statusText }}</div>

  <div class="card-divider" *ngIf="hasActions"></div>

  <!-- Actions Section -->
  <div class="card-actions" *ngIf="hasActions">
    <app-character-actions
      [actions]="actions!"
      [characterId]="character.id"
      (actionClick)="handleActionClick($event)">
    </app-character-actions>
  </div>
</div>
