<!-- src/app/components/tavern-character-card/tavern-character-card.component.html -->
<div class="tavern-character-card">
  <!-- Left side: Character Info (60%) -->
  <div class="character-info">
    <div class="character-name">{{ character.name }}</div>
    <div class="character-details">
      <span class="character-class">Level {{ character.level }} {{ character.class }}</span>
      <span class="separator"> | </span>
      <span class="character-race">{{ character.race }} {{ character.alignment }}</span>
    </div>
    <div class="character-status">Status: {{ character.status }}</div>
  </div>

  <!-- Right side: Actions (40%) -->
  <div class="character-actions">
    <!-- Add/Remove and Inspect buttons (on same row) -->
    @if (!isInParty) {
      <div class="button-row">
        <button
          class="action-button add-button"
          data-action="add"
          (click)="onAddClick()">
          Add
        </button>
        <button
          class="action-button inspect-button"
          data-action="inspect"
          (click)="onInspectClick()">
          Inspect
        </button>
      </div>
    } @else {
      <div class="button-row">
        <button
          class="action-button remove-button"
          data-action="remove"
          (click)="onRemoveClick()">
          Remove
        </button>
        <button
          class="action-button inspect-button"
          data-action="inspect"
          (click)="onInspectClick()">
          Inspect
        </button>
      </div>

      <!-- Move Up/Down buttons (only when in party) -->
      <div class="move-buttons">
        <button
          class="action-button move-button"
          data-action="move-up"
          [disabled]="!canMoveUp"
          (click)="onMoveUpClick()">
          Move Up
        </button>
        <button
          class="action-button move-button"
          data-action="move-down"
          [disabled]="!canMoveDown"
          (click)="onMoveDownClick()">
          Move Down
        </button>
      </div>
    }
  </div>
</div>
