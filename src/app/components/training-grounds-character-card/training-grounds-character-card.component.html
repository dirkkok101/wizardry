<!-- src/app/components/training-grounds-character-card/training-grounds-character-card.component.html -->
<div class="training-grounds-character-card">
  <!-- Character Info Section (70%) -->
  <div class="character-info">
    <div class="character-name">{{ character.name }}</div>
    <div class="character-details">
      <span class="character-race">{{ character.race }}</span>
      <span class="character-class">{{ character.class }}</span>
      <span class="character-level">Lvl {{ character.level }}</span>
    </div>
    <div class="status-badge">{{ status }}</div>
  </div>

  <!-- Actions Section (30%) -->
  <div class="character-actions">
    <button class="inspect-button" (click)="onInspect()">Inspect</button>
    <button class="delete-button" (click)="onDelete()">Delete</button>
  </div>
</div>
