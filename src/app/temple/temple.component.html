<div class="temple-scene">
  <app-scene-title title="TEMPLE OF CANT" [showPartyGold]="true" />

  <div class="temple-content">
    @if (afflictedCharacters().length > 0) {
      <app-party-character-grid
        source="afflicted"
        [visibleFields]="visibleFields"
        [actions]="getCharacterActions"
        (actionClick)="handleCharacterAction($event)"
        emptyMessage="No afflicted party members"
      />
    } @else {
      <div class="empty-state">
        <p>Your party is in good health.</p>
        <p>No one requires the temple's services at this time.</p>
      </div>
    }

    @if (messages.hasMessage()) {
      <div class="message"
           [class.error]="messages.isError()"
           [class.success]="messages.isSuccess()"
           [class.info]="messages.message()?.type === 'info'">
        {{ messages.messageText() }}
      </div>
    }
  </div>

  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />

  @if (showConfirmation()) {
    <app-confirmation-dialog
      [message]="confirmationMessage()"
      (confirm)="confirmService()"
      (cancel)="cancelService()"
    />
  }
</div>
