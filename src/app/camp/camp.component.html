<div class="camp-container">
  <app-scene-title title="CAMP" />

  @if (messages.hasMessage()) {
    <div class="message" [class.error]="messages.isError()" [class.success]="messages.isSuccess()">
      {{ messages.messageText() }}
    </div>
  }

  <section class="party-section">
    <app-party-character-grid
      source="party"
      [showFormation]="true"
      [visibleFields]="['class', 'level', 'hp', 'ac']"
      [actions]="getActionsForCharacter"
      emptyMessage="No party members"
      (actionClick)="handleActionClick($event)"
    />
  </section>

  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)" />
</div>
