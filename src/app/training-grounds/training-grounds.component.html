<div class="training-grounds">
  <!-- Title -->
  <app-scene-title [title]="'TRAINING GROUNDS'" />

  <!-- Character Cards Grid -->
  <main class="character-grid">
    @if (availableCharacters().length === 0) {
      <div class="empty-state">
        <p>No characters available</p>
        <p>Create your first adventurer to begin!</p>
      </div>
    } @else {
      @for (item of availableCharacters(); track item.character.id) {
        <app-character-card
          [character]="item.character"
          [status]="item.status"
          (inspect)="handleInspectCharacter($event)"
          (delete)="handleDeleteCharacter($event)">
        </app-character-card>
      }
    }
  </main>

  <!-- Error Message -->
  @if (errorMessage()) {
    <div class="error-message">
      <p>{{ errorMessage() }}</p>
    </div>
  }

  <!-- Navigation Footer -->
  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />

  <!-- Confirmation Dialog -->
  @if (showDeleteConfirmation()) {
    <app-confirmation-dialog
      [title]="'Delete Character?'"
      [message]="deleteConfirmationMessage()"
      (confirm)="confirmDelete()"
      (cancel)="cancelDelete()">
    </app-confirmation-dialog>
  }
</div>
