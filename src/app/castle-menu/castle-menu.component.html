<div class="castle-menu">
  <app-scene-title title="CASTLE" [showPartyGold]="true" />

  <section class="party-section">
    <h2>PARTY</h2>
    <div class="party-members">
      @for (char of partyCharacters(); track char.id) {
        <app-character-card
          [character]="char"
          [visibleFields]="['race', 'class', 'level', 'hp', 'ac']"
          [actions]="[{ type: 'inspect' }]"
          variant="default"
          (actionClick)="handleActionClick($event)">
        </app-character-card>
      }
      @empty {
        <p class="no-party">No party members</p>
      }
    </div>
  </section>

  <main class="content-area">
    <!-- Main content area -->
  </main>

  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />
</div>
