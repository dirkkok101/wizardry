<div class="maze-scene">
  <!-- Title with Active Spells -->
  <app-scene-title [title]="sceneTitle()" [activeSpells]="activeSpells()"></app-scene-title>

  @if (isLoadingLevel()) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading Level {{ currentLevel() }}...</p>
    </div>
  }

  @if (errorMessage()) {
    <div class="error-message">{{ errorMessage() }}</div>
  }

  <!-- 3-Column Layout: Left | Center | Right -->
  <div class="maze-content">
    <!-- Left Column: Positions 1, 3, 5 -->
    <div class="left-panel">
      <app-character-panel
        [characters]="leftColumnCharacters()"
        [actions]="getActionsForCharacter"
        (actionClick)="handleCharacterAction($event)"
      />
    </div>

    <!-- Center Column: Renderer + Message Log -->
    <div class="center-panel">
      <div class="maze-viewport">
        <canvas #mazeCanvas width="740" height="375"></canvas>
      </div>

      <div class="message-log-section">
        <app-message-log [messages]="messages()" />
      </div>
    </div>

    <!-- Right Column: Positions 2, 4, 6 -->
    <div class="right-panel">
      <app-character-panel
        [characters]="rightColumnCharacters()"
        [actions]="getActionsForCharacter"
        (actionClick)="handleCharacterAction($event)"
      />
    </div>
  </div>

  <!-- Scene Footer with Navigation Controls -->
  <app-scene-footer
    [menuItems]="mazeMenuItems()"
    (itemSelected)="handleMenuAction($event)"
  />

  <!-- Elevator Dialog (if active) -->
  @if (showElevatorDialog()) {
    <div class="elevator-dialog-overlay">
      <div class="elevator-dialog">
        <h2>ELEVATOR</h2>
        <p>Select destination level:</p>
        <div class="elevator-buttons">
          @for (dest of elevatorDestinations(); track dest) {
            <button (click)="selectElevatorLevel(dest.level!)" class="elevator-button">
              Level {{ dest.level }}
            </button>
          }
        </div>
        <button (click)="cancelElevator()" class="elevator-cancel">
          Cancel (ESC)
        </button>
      </div>
    </div>
  }

  <!-- Spell Selection Panel -->
  @if (selectedCaster()) {
    <app-spell-panel
      [visible]="showSpellDialog()"
      [character]="selectedCaster()!"
      [mode]="'casting'"
      [context]="'dungeon'"
      [title]="'SELECT SPELL'"
      (spellSelected)="onSpellSelected($event)"
      (closed)="onSpellDialogCancelled()"
    />
  }

  <!-- Character Target Selection Dialog -->
  <app-character-selection-dialog
    [visible]="showTargetDialog()"
    [characters]="targetOptions()"
    [prompt]="'SELECT TARGET'"
    (characterSelected)="onTargetSelected($event)"
    (cancelled)="onTargetDialogCancelled()"
  />
</div>
