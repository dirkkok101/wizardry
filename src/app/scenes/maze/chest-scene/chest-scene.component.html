<div class="chest-scene">
  <!-- Title -->
  <app-scene-title [title]="sceneTitle()"></app-scene-title>

  <!-- 3-Column Layout: Left | Center | Right -->
  <div class="maze-content">
    <!-- Left Column: Positions 1, 3, 5 -->
    <div class="left-panel">
      <app-character-panel
        [characters]="leftColumnCharacters()"
        [actions]="getChestActionsForCharacter"
        [visibleActionTypes]="['open', 'inspect', 'calfo', 'disarm']"
        [hitCharacterIds]="hitCharacterIds()"
        [damageIndicator]="currentDamageIndicator()"
        [showSprites]="true"
        (actionClick)="handleChestCardAction($event)"
      />
    </div>

    <!-- Center Column: Chest Overlay + Message Log -->
    <div class="center-panel">
      <div class="chest-viewport">
        <!-- Chest Overlay (Full theater stage) -->
        <app-chest-overlay
          [visible]="true"
          [phase]="chestPhase()"
          [chest]="pendingChest()"
          [spriteState]="chestSprite()"
          [scrambledState]="scrambledTrapState()"
          [trapInput]="chestTrapInput()"
          [summary]="chestSummary()"
          [availableCharacters]="partyCharacters()"
          [calfoEligibleCasters]="calfoEligibleCasters()"
          [selectedOpener]="chestOpener()"
          [lastMessage]="chestLastMessage()"
          [recommendedHandler]="recommendedChestHandler()"
          [inventoryWarning]="chestInventoryWarning()"
          [letterboxType]="chestLetterboxType()"
          [inspectChance]="chestInspectChance()"
          [disarmChance]="chestDisarmChance()"
          [trapLetterboxName]="trapLetterboxName()"
          (characterSelected)="onChestCharacterSelected($event)"
          (casterSelected)="onChestCasterSelected($event)"
        />
      </div>

      <!-- Message Log (hidden during chest interaction) -->
      <!-- Note: Messages show in chest overlay instead -->
    </div>

    <!-- Right Column: Positions 2, 4, 6 -->
    <div class="right-panel">
      <app-character-panel
        [characters]="rightColumnCharacters()"
        [actions]="getChestActionsForCharacter"
        [visibleActionTypes]="['open', 'inspect', 'calfo', 'disarm']"
        [hitCharacterIds]="hitCharacterIds()"
        [damageIndicator]="currentDamageIndicator()"
        [showSprites]="true"
        (actionClick)="handleChestCardAction($event)"
      />
    </div>
  </div>

  <!-- Footer Actions -->
  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />
</div>
