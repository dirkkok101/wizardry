<div class="spell-casting-container">
  <!-- Phase 1: Spell Selection -->
  @if (caster(); as char) {
    <app-spell-panel
      [visible]="phase() === 'selecting-spell'"
      [character]="char"
      [mode]="'casting'"
      [context]="context()"
      [title]="'SELECT SPELL'"
      (spellSelected)="onSpellSelected($event)"
      (closed)="returnToPrevious()"
    />
  }

  <!-- Phase 2: Target Selection (when needed) -->
  <app-character-selection-dialog
    [visible]="phase() === 'selecting-target'"
    [characters]="targetOptions()"
    [prompt]="targetPrompt()"
    (characterSelected)="onTargetSelected($event)"
    (cancelled)="cancelTargetSelection()">
  </app-character-selection-dialog>
</div>
