<div class="castle-menu">
  <app-scene-title title="CASTLE" [showPartyGold]="true" />

  <section class="party-section">
    @if (frontRowCharacters().length > 0 || backRowCharacters().length > 0) {
      <div class="formation-layout">
        <!-- Front Row -->
        <div class="formation-column">
          <h3 class="row-title">Front Row</h3>
          <app-character-panel
            [characters]="frontRowCharacters()"
            [actions]="getActionsForCharacter"
            (actionClick)="handleActionClick($event)"
          />
        </div>

        <!-- Back Row -->
        <div class="formation-column">
          <h3 class="row-title">Back Row</h3>
          <app-character-panel
            [characters]="backRowCharacters()"
            [actions]="getActionsForCharacter"
            (actionClick)="handleActionClick($event)"
          />
        </div>
      </div>
    } @else {
      <div class="empty-state">
        <p>No party formed.</p>
        <p>Visit the Tavern to form a party.</p>
      </div>
    }
  </section>

  <main class="content-area">
    <!-- Main content area -->
  </main>

  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />
</div>
