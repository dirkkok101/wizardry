<div class="training-grounds">
  <!-- Title -->
  <app-scene-title [title]="'TRAINING GROUNDS'" />

  <!-- Character Roster -->
  <main class="roster-content">
    @if (availableCharacters().length === 0) {
      <app-empty-state
        title="No characters available"
        subtitle="Create your first adventurer to begin!"
      />
    } @else {
      <div class="character-list">
        @for (char of availableCharacters(); track char.character.id) {
          <app-character-list-item
            [character]="char.character"
            [showAlignment]="true"
            [showStatus]="true"
            [status]="char.status">
            <ng-template #actions>
              <button class="action-btn" (click)="handleInspectCharacter(char.character.id)">Inspect</button>
              <button class="action-btn danger" (click)="handleDeleteCharacter(char.character.id)">Delete</button>
            </ng-template>
          </app-character-list-item>
        }
      </div>
    }
  </main>

  <!-- Error Message -->
  @if (messages.hasMessage()) {
    <div class="message" [class.error]="messages.isError()" [class.success]="messages.isSuccess()">
      <p>{{ messages.messageText() }}</p>
    </div>
  }

  <!-- Navigation Footer -->
  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />

  <!-- Confirmation Dialog -->
  @if (showDeleteConfirmation()) {
    <app-confirmation-dialog
      [visible]="showDeleteConfirmation()"
      [message]="deleteConfirmationMessage()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()">
    </app-confirmation-dialog>
  }
</div>
