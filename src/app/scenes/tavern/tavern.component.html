<div class="tavern-scene">
  <!-- Header -->
  <app-scene-title title="GILGAMESH'S TAVERN" [showPartyGold]="true" />

  <!-- Message display -->
  @if (messages.hasMessage()) {
    <div class="message" [class.error]="messages.isError()" [class.success]="messages.isSuccess()">
      {{ messages.messageText() }}
    </div>
  }

  <!-- 3-Column Layout -->
  <div class="tavern-content">
    <!-- Left Panel: Positions 1, 3, 5 -->
    <div class="left-panel">
      <app-character-panel
        [characters]="leftColumnCharacters()"
        [actions]="getPartyActions"
        [visibleActionTypes]="partyActionTypes"
        [showSprites]="true"
        (actionClick)="handleActionClick($event)"
      />
    </div>

    <!-- Center Panel: Scene Sprite -->
    <div class="center-panel">
      <div class="scene-viewport">
        <img
          [appCachedSrc]="'assets/sprites/scenes/tavern_scene.png'"
          alt="Gilgamesh's Tavern"
          class="scene-image"
        />
      </div>
    </div>

    <!-- Right Panel: Positions 2, 4, 6 -->
    <div class="right-panel">
      <app-character-panel
        [characters]="rightColumnCharacters()"
        [actions]="getPartyActions"
        [visibleActionTypes]="partyActionTypes"
        [showSprites]="true"
        (actionClick)="handleActionClick($event)"
      />
    </div>
  </div>

  <!-- Footer -->
  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />

  <!-- Add Character Dialog -->
  <app-character-selection-dialog
    [visible]="showAddDialog()"
    [characters]="dialogCharacters()"
    [prompt]="'SELECT CHARACTER TO ADD'"
    (characterSelected)="onDialogCharacterSelected($event)"
    (cancelled)="onDialogCancelled()"
  />
</div>
