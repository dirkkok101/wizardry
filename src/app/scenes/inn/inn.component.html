<div class="inn-scene">
  <app-scene-title title="ADVENTURER'S INN" [showPartyGold]="true" />

  <div class="inn-content">
    <!-- Left Column: Party positions 1, 3, 5 -->
    <div class="left-panel">
      <app-character-panel
        [characters]="leftColumnCharacters()"
        [actions]="[{type: 'inspect', label: 'Inspect'}]"
        [visibleActionTypes]="['inspect']"
        [showSprites]="true"
        (actionClick)="handleCharacterAction($event)"
      />
    </div>

    <!-- Center Column: Scene viewport -->
    <div class="center-panel">
      <div class="scene-viewport">
        <img [appCachedSrc]="'assets/sprites/scenes/adventurers_inn_scene.png'" alt="Adventurer's Inn" class="scene-image" />
      </div>
    </div>

    <!-- Right Column: Party positions 2, 4, 6 -->
    <div class="right-panel">
      <app-character-panel
        [characters]="rightColumnCharacters()"
        [actions]="[{type: 'inspect', label: 'Inspect'}]"
        [visibleActionTypes]="['inspect']"
        [showSprites]="true"
        (actionClick)="handleCharacterAction($event)"
      />
    </div>
  </div>

  <!-- Messages -->
  @if (messages.hasMessage()) {
    <div class="message" [class.error]="messages.isError()" [class.success]="messages.isSuccess()">
      {{ messages.messageText() }}
    </div>
  }

  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />

  <!-- Rest Results Modal -->
  @if (showRestResults() && restResults()) {
    <app-rest-results-modal
      [visible]="true"
      [results]="restResults()!"
      (dismissed)="dismissRestResults()"
    />
  }
</div>
