<div class="inn-scene">
  <app-scene-title title="ADVENTURER'S INN" [showPartyGold]="true" />

  <div class="inn-content">
    @if (partyCharacters().length > 0) {
      <div class="inn-layout">
        <!-- Column 1: Front Row -->
        <section class="formation-column">
          <h3 class="row-title">Front Row</h3>
          <app-character-panel
            [characters]="frontRowCharacters()"
            [actions]="[{type: 'inspect'}]"
            (actionClick)="handleCharacterAction($event)"
          />
        </section>

        <!-- Column 2: Back Row -->
        <section class="formation-column">
          <h3 class="row-title">Back Row</h3>
          <app-character-panel
            [characters]="backRowCharacters()"
            [actions]="[{type: 'inspect'}]"
            (actionClick)="handleCharacterAction($event)"
          />
        </section>

        <!-- Column 3: Rest Options -->
        <section class="actions-section">
          <h3 class="row-title">REST OPTIONS</h3>
          <div class="rest-actions">
            @for (config of restActionConfigs(); track config.type; let i = $index) {
              <app-rest-action-card
                [config]="config"
                [shortcutKey]="i + 1"
                (selected)="handleRestActionSelected($event)"
              />
            }
          </div>
        </section>
      </div>
    } @else {
      <app-empty-state
        title="No party formed"
        subtitle="Visit the Tavern to recruit adventurers"
      />
    }

    <!-- Messages -->
    @if (messages.hasMessage()) {
      <div class="message" [class.error]="messages.isError()" [class.success]="messages.isSuccess()">
        {{ messages.messageText() }}
      </div>
    }
  </div>

  <!-- Footer menu -->
  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />

  <!-- Rest Results Modal -->
  @if (showRestResults() && restResults()) {
    <app-rest-results-modal
      [visible]="true"
      [results]="restResults()!"
      (dismissed)="dismissRestResults()"
    />
  }
</div>
