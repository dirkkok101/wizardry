<div class="temple-scene">
  <app-scene-title title="TEMPLE OF CANT" [showPartyGold]="true" />

  <div class="temple-content">
    <!-- Left Column: Party positions 1, 3, 5 -->
    <div class="left-panel">
      <app-character-panel
        [characters]="leftColumnCharacters()"
        [actions]="getCharacterActions"
        [visibleActionTypes]="visibleActionTypes"
        [showSprites]="true"
        (actionClick)="handleCharacterAction($event)"
      />
    </div>

    <!-- Center Column: Scene viewport -->
    <div class="center-panel">
      <div class="scene-viewport">
        <img src="assets/sprites/scenes/temple_scene.png" alt="Temple of Cant" class="scene-image" />
      </div>
    </div>

    <!-- Right Column: Party positions 2, 4, 6 -->
    <div class="right-panel">
      <app-character-panel
        [characters]="rightColumnCharacters()"
        [actions]="getCharacterActions"
        [visibleActionTypes]="visibleActionTypes"
        [showSprites]="true"
        (actionClick)="handleCharacterAction($event)"
      />
    </div>
  </div>

  <!-- Messages -->
  @if (messages.hasMessage()) {
    <div class="message" [class.error]="messages.isError()" [class.success]="messages.isSuccess()">
      {{ messages.messageText() }}
    </div>
  }

  <app-scene-footer
    [menuItems]="footerMenuItems()"
    (itemSelected)="handleFooterAction($event)"
  />
</div>
